name: Demo Video Auto-Update

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'supabase/**'
      - 'scripts/demo/**'
      - '.github/workflows/demo-video.yml'
  workflow_dispatch:

env:
  SITE_URL: https://phikila-app.vercel.app
  R2_BUCKET: phikila-demo
  R2_PUBLIC_URL: https://pub-4cad27e8f2764072a35726cc9af64723.r2.dev

jobs:
  build-demo-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install edge-tts

      - run: npm ci

      - name: Install Playwright
        run: |
          npx playwright install chromium --with-deps
          npm ls playwright-core

      - name: Reset demo database
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          DB_URL="postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.pgiytpbrnyxnnfupvaiv.supabase.co:5432/postgres"
          
          echo "Clearing demo data..."
          psql "$DB_URL" <<-'SQL' || true
            DELETE FROM attendance_records WHERE school_id IN (SELECT id FROM schools WHERE slug = 'phikila-demo');
            DELETE FROM payments WHERE student_account_id IN (SELECT sa.id FROM student_accounts sa JOIN schools s ON sa.school_id = s.id WHERE s.slug = 'phikila-demo');
            DELETE FROM student_accounts WHERE school_id IN (SELECT id FROM schools WHERE slug = 'phikila-demo');
            DELETE FROM students WHERE school_id IN (SELECT id FROM schools WHERE slug = 'phikila-demo');
            DELETE FROM staff WHERE school_id IN (SELECT id FROM schools WHERE slug = 'phikila-demo');
            DELETE FROM class_teachers WHERE class_id IN (SELECT c.id FROM classes c JOIN schools s ON c.school_id = s.id WHERE s.slug = 'phikila-demo');
            DELETE FROM subjects WHERE school_id IN (SELECT id FROM schools WHERE slug = 'phikila-demo');
            DELETE FROM classes WHERE school_id IN (SELECT id FROM schools WHERE slug = 'phikila-demo');
            DELETE FROM grades WHERE school_id IN (SELECT id FROM schools WHERE slug = 'phikila-demo');
            DELETE FROM fee_structures WHERE school_id IN (SELECT id FROM schools WHERE slug = 'phikila-demo');
            DELETE FROM terms WHERE academic_year_id IN (SELECT id FROM academic_years WHERE school_id IN (SELECT id FROM schools WHERE slug = 'phikila-demo'));
            DELETE FROM academic_years WHERE school_id IN (SELECT id FROM schools WHERE slug = 'phikila-demo');
            DELETE FROM school_members WHERE school_id IN (SELECT id FROM schools WHERE slug = 'phikila-demo');
            DELETE FROM profiles WHERE id IN (SELECT user_id FROM auth.users WHERE email = 'demo@phikila.app');
            DELETE FROM schools WHERE slug = 'phikila-demo';
          SQL
          
          echo "Seeding fresh data..."
          psql "$DB_URL" -f supabase/seed-demo.sql || echo "Seed had warnings, continuing..."

      - name: Ensure demo user exists in Supabase Auth
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBnaXl0cGJybnl4bm5mdXB2YWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzOTA2MzUsImV4cCI6MjEwMzk2NjYzNX0.f_-FVAYXS3pZuGIJGAcqPuRvrV95QVQXslCcHyGu85o
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Delete existing demo user if present (ignore errors)
          echo "Cleaning up existing demo user..."
          EXISTING=$(curl -s \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "https://pgiytpbrnyxnnfupvaiv.supabase.co/auth/v1/admin/users?email=demo@phikila.app")
          
          EXISTING_ID=$(echo "$EXISTING" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          users = d.get('users',[])
          for u in users:
              if u.get('email') == 'demo@phikila.app':
                  print(u['id'])
                  break
          else:
              print('')
          " 2>/dev/null || echo "")
          
          if [ -n "$EXISTING_ID" ]; then
            echo "Found existing demo user: $EXISTING_ID, deleting..."
            curl -s -X DELETE \
              -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "https://pgiytpbrnyxnnfupvaiv.supabase.co/auth/v1/admin/users/$EXISTING_ID" || true
          fi
          
          echo "Creating demo user with email/password..."
          CREATE_RESPONSE=$(curl -s -X POST \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"demo@phikila.app","password":"Demo1234!","email_confirm":true}' \
            "https://pgiytpbrnyxnnfupvaiv.supabase.co/auth/v1/admin/users")
          echo "Create response: $(echo "$CREATE_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id','') or d.get('msg','error'))" 2>/dev/null || echo "$CREATE_RESPONSE")"
          
          echo "Verifying auth works..."
          AUTH_RESPONSE=$(curl -s -X POST \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"demo@phikila.app","password":"Demo1234!"}' \
            "https://pgiytpbrnyxnnfupvaiv.supabase.co/auth/v1/token?grant_type=password")
          echo "Auth response: $(echo "$AUTH_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print('OK' if 'access_token' in d else d)" 2>/dev/null || echo "$AUTH_RESPONSE")"

      - name: Build and start app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://pgiytpbrnyxnnfupvaiv.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBnaXl0cGJybnl4bm5mdXB2YWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzOTA2MzUsImV4cCI6MjEwMzk2NjYzNX0.f_-FVAYXS3pZuGIJGAcqPuRvrV95QVQXslCcHyGu85o
          NEXT_PUBLIC_SITE_URL: https://phikila-app.vercel.app
        run: |
          npm run build
          PORT=3000 npm run start &
          echo $! > /tmp/server.pid
          
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000; then
              echo "Server ready"
              break
            fi
            sleep 2
          done

      - name: Record demo with Playwright
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://pgiytpbrnyxnnfupvaiv.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBnaXl0cGJybnl4bm5mdXB2YWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzOTA2MzUsImV4cCI6MjEwMzk2NjYzNX0.f_-FVAYXS3pZuGIJGAcqPuRvrV95QVQXslCcHyGu85o
        run: |
          cd scripts/demo
          PLAYWRIGHT_BASE_URL=http://localhost:3000 npx tsx record.ts

      - name: Generate TTS narration
        run: |
          cd scripts/demo
          python3 generate-tts.py

      - name: Render video with FFmpeg
        run: |
          cd scripts/demo
          bash render.sh

      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
        run: |
          cd scripts/demo
          
          DATE=$(date +%Y%m%d)
          R2_KEY="demo/phikila-demo-${DATE}.mp4"
          R2_THUMB="demo/thumbnail-${DATE}.jpg"
          
          echo "Uploading video..."
          npx wrangler r2 object put "${R2_BUCKET}/${R2_KEY}" \
            --file output/phikila-demo.mp4 \
            --content-type "video/mp4" \
            --remote
          
          echo "Uploading thumbnail..."
          npx wrangler r2 object put "${R2_BUCKET}/${R2_THUMB}" \
            --file output/thumbnail.jpg \
            --content-type "image/jpeg" \
            --remote
          
          VIDEO_URL="${R2_PUBLIC_URL}/${R2_KEY}"
          THUMB_URL="${R2_PUBLIC_URL}/${R2_THUMB}"
          
          echo "VIDEO_URL=${VIDEO_URL}" >> $GITHUB_ENV
          echo "THUMB_URL=${THUMB_URL}" >> $GITHUB_ENV
          
          # Save URLs
          cat > output/r2-urls.json << EOF
          {"videoUrl":"${VIDEO_URL}","thumbnailUrl":"${THUMB_URL}","uploadedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF

      - name: Update landing page video URL
        continue-on-error: true
        run: |
          if [ -n "${VIDEO_URL:-}" ]; then
            echo "Updating landing page with video URL: $VIDEO_URL"
            UPDATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            VERSION=$(date +%Y%m%d%H%M)
            cat > public/demo-config.json <<OUTER
          {
            "videoUrl": "${VIDEO_URL}",
            "thumbnailUrl": "${THUMB_URL}",
            "updatedAt": "${UPDATED}",
            "version": "${VERSION}"
          }
          OUTER
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/demo-config.json
            if git diff --staged --quiet; then
              echo "No changes to demo-config.json"
            else
              git commit -m "chore: update demo video URL [skip ci]"
              git fetch origin main
              git rebase origin/main
              git push origin main
            fi
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: |
            scripts/demo/output/phikila-demo.mp4
            scripts/demo/output/thumbnail.jpg
            scripts/demo/output/captions.srt
            scripts/demo/output/r2-urls.json
          retention-days: 30

      - name: Stop server
        if: always()
        run: kill $(cat /tmp/server.pid 2>/dev/null) 2>/dev/null || true
