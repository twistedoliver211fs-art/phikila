name: Demo Portals — Create Users & Record

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/seed-demo.sql'
      - 'scripts/demo/record-portals.ts'
      - '.github/workflows/demo-portals.yml'

env:
  SITE_URL: https://decimal-app.vercel.app
  SUPABASE_URL: https://pgiytpbrnyxnnfupvaiv.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBnaXl0cGJybnl4bm5mdXB2YWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzOTA2MzUsImV4cCI6MjEwMzk2NjYzNX0.f_-FVAYXS3pZuGIJGAcqPuRvrV95QVQXslCcHyGu85o
  DEMO_PASSWORD: Demo1234!

jobs:
  create-users-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg postgresql-client jq

      - run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Create all demo users via Supabase Admin API
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🔐 Creating demo users for all portals..."
          
          USERS=(
            "principal@decimal.app"
            "teacher@decimal.app"
            "parent@decimal.app"
            "finance@decimal.app"
            "secretary@decimal.app"
            "admissions@decimal.app"
          )
          
          for EMAIL in "${USERS[@]}"; do
            echo "Checking $EMAIL..."
            
            # Check if user exists
            EXISTING=$(curl -s \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$SUPABASE_URL/auth/v1/admin/users?email=$EMAIL")
            
            EXISTING_ID=$(echo "$EXISTING" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          users = d.get('users',[])
          for u in users:
              if u.get('email') == '$EMAIL':
                  print(u['id'])
                  break
          else:
              print('')
          " 2>/dev/null || echo "")
            
            if [ -n "$EXISTING_ID" ]; then
              echo "  ✅ $EMAIL already exists ($EXISTING_ID)"
            else
              echo "  Creating $EMAIL..."
              CREATE_RESPONSE=$(curl -s -X POST \
                -H "apikey: $SUPABASE_ANON_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"email\":\"$EMAIL\",\"password\":\"$DEMO_PASSWORD\",\"email_confirm\":true}" \
                "$SUPABASE_URL/auth/v1/admin/users")
              
              NEW_ID=$(echo "$CREATE_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
              if [ -n "$NEW_ID" ]; then
                echo "  ✅ Created $EMAIL ($NEW_ID)"
              else
                echo "  ❌ Failed: $CREATE_RESPONSE"
              fi
            fi
          done
          
          echo ""
          echo "🔐 Creating super admin user..."
          ADMIN_EXISTING=$(curl -s \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/auth/v1/admin/users?email=admin@decimal.app")
          
          ADMIN_ID=$(echo "$ADMIN_EXISTING" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          users = d.get('users',[])
          for u in users:
              if u.get('email') == 'admin@decimal.app':
                  print(u['id'])
                  break
          else:
              print('')
          " 2>/dev/null || echo "")
          
          if [ -n "$ADMIN_ID" ]; then
            echo "  ✅ admin@decimal.app already exists"
          else
            curl -s -X POST \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@decimal.app","password":"Dec1m@lAdm!n2026","email_confirm":true}' \
              "$SUPABASE_URL/auth/v1/admin/users" | python3 -c "import sys,json; d=json.load(sys.stdin); print('  ✅ Created admin@decimal.app' if 'id' in d else f'  ❌ Failed: {d}')" 2>/dev/null || echo "  ❌ Failed"
          fi
          
          echo ""
          echo "✅ All demo users ready"

      - name: Reset demo database
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          DB_URL="postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.pgiytpbrnyxnnfupvaiv.supabase.co:5432/postgres"
          
          echo "Clearing demo data..."
          psql "$DB_URL" <<-'SQL' || true
            DELETE FROM attendance_records WHERE school_id IN (SELECT id FROM schools WHERE slug = 'decimal-demo');
            DELETE FROM payments WHERE student_account_id IN (SELECT sa.id FROM student_accounts sa JOIN schools s ON sa.school_id = s.id WHERE s.slug = 'decimal-demo');
            DELETE FROM student_accounts WHERE school_id IN (SELECT id FROM schools WHERE slug = 'decimal-demo');
            DELETE FROM students WHERE school_id IN (SELECT id FROM schools WHERE slug = 'decimal-demo');
            DELETE FROM staff WHERE school_id IN (SELECT id FROM schools WHERE slug = 'decimal-demo');
            DELETE FROM class_teachers WHERE class_id IN (SELECT c.id FROM classes c JOIN schools s ON c.school_id = s.id WHERE s.slug = 'decimal-demo');
            DELETE FROM subjects WHERE school_id IN (SELECT id FROM schools WHERE slug = 'decimal-demo');
            DELETE FROM classes WHERE school_id IN (SELECT id FROM schools WHERE slug = 'decimal-demo');
            DELETE FROM grades WHERE school_id IN (SELECT id FROM schools WHERE slug = 'decimal-demo');
            DELETE FROM fee_structures WHERE school_id IN (SELECT id FROM schools WHERE slug = 'decimal-demo');
            DELETE FROM terms WHERE academic_year_id IN (SELECT id FROM academic_years WHERE school_id IN (SELECT id FROM schools WHERE slug = 'decimal-demo'));
            DELETE FROM academic_years WHERE school_id IN (SELECT id FROM schools WHERE slug = 'decimal-demo');
            DELETE FROM school_members WHERE school_id IN (SELECT id FROM schools WHERE slug = 'decimal-demo');
            DELETE FROM profiles WHERE id IN (SELECT user_id FROM auth.users WHERE email LIKE '%@decimal.app');
            DELETE FROM schools WHERE slug = 'decimal-demo';
          SQL
          
          echo "Seeding fresh data..."
          psql "$DB_URL" -f supabase/seed-demo.sql || echo "Seed had warnings, continuing..."

      - name: Build and start app
        env:
          NEXT_PUBLIC_SUPABASE_URL: $SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY
          NEXT_PUBLIC_SITE_URL: https://decimal-app.vercel.app
        run: |
          npm run build -- --webpack
          lsof -ti:3000 | xargs kill -9 2>/dev/null || true
          PORT=3000 npm run start > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/server.pid
          
          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "Server failed to start!"
            cat /tmp/server.log
            exit 1
          fi
          
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000; then
              echo "Server ready after ${i} attempts"
              break
            fi
            sleep 2
          done

      - name: Record all portal demos
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts/demo
          npx tsx record-portals.ts

      - name: Verify recordings
        run: |
          echo "📁 Portal recordings:"
          for portal in principal teacher parent finance secretary admissions; do
            if [ -d "scripts/demo/output/$portal" ]; then
              COUNT=$(ls scripts/demo/output/$portal/*.webm 2>/dev/null | wc -l)
              echo "  ✅ $portal: $COUNT video(s)"
            else
              echo "  ❌ $portal: missing"
            fi
          done

      - name: Stop server
        if: always()
        run: kill $(cat /tmp/server.pid 2>/dev/null) 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-portals
          path: scripts/demo/output/
          retention-days: 30
