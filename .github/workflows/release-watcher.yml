name: Release Watcher

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  check-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check for new upstream releases
        id: check
        run: |
          echo "Checking latest release..."
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/twistedoliver211fs-art/phikila/releases/latest | jq -r '.tag_name')
          echo "Upstream latest: $UPSTREAM_TAG"
          echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          
          # Read local version from package.json
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: $LOCAL_VERSION"
          echo "local_version=$LOCAL_VERSION" >> $GITHUB_OUTPUT
          
          # Normalize: strip leading 'v' for comparison
          UPSTREAM_NORM="${UPSTREAM_TAG#v}"
          LOCAL_NORM="${LOCAL_VERSION#v}"
          
          if [ "$UPSTREAM_TAG" = "null" ] || [ -z "$UPSTREAM_TAG" ]; then
            echo "version_behind=false" >> $GITHUB_OUTPUT
            echo "No GitHub release yet"
          elif [ "$UPSTREAM_NORM" != "$LOCAL_NORM" ]; then
            echo "version_behind=true" >> $GITHUB_OUTPUT
            echo "package.json ($LOCAL_NORM) does not match latest release ($UPSTREAM_NORM)"
          else
            echo "version_behind=false" >> $GITHUB_OUTPUT
            echo "Local version is up to date"
          fi
      - name: Create issue if behind
        if: steps.check.outputs.version_behind == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const upstream = '${{ steps.check.outputs.upstream_tag }}';
            const local = '${{ steps.check.outputs.local_version }}';
            const body = `Upstream release **${upstream}** is available but this repository is on **${local}**.\n\nPlease review and merge the upstream changes or update the version.`;
            
            // Check if an open issue already exists for this
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-release',
              per_page: 10
            });
            
            const hasOpen = existing.some(i => i.title.includes(upstream));
            if (hasOpen) {
              console.log('Issue already exists for this release');
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Upstream release ${upstream} available (local: ${local})`,
                body,
                labels: ['upstream-release']
              });
              console.log('Issue created');
            }
