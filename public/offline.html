<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Phikila</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #1e293b; }

    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #64748b; line-height: 1.6; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    a { color: #4f46e5; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You&apos;re offline</h1>

    <p style="margin-top: 1.5rem"><a href="javascript:location.reload()">Retry</a></p>
  </div>
</body>
</html>
